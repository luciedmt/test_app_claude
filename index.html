
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>CarData Demos 2026</title>

<style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }  
    html,
    body {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
      body {
        background: #282431;
        color: #fff;
        font-family: 'Space Mono', monospace;
      }
    /* Handle mobile viewport height properly */
   .app-container {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        height: var(--app-height, 100dvh);
        
        display: flex;
        flex-direction: column;
        overflow: visible;
        background: #282431;
    }
    /* Support dynamic viewport height for mobile */
    .goodbye-message {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #121112 0%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      text-align: center;
      padding: 24px;
    }
    .goodbye-message-text {
      font-size: clamp(18px, 5vw, 24px);
      color: #ffffff;
      font-family: 'Space Mono', monospace;
      line-height: 1.8;
      margin-bottom: 24px;
    }
    .goodbye-heart {
      font-size: clamp(40px, 15vw, 60px);
      margin: 24px 0;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .heart-firework-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
    .heart-firework {
      position: absolute;
      font-size: 50px;
      pointer-events: none;
    }
    @keyframes heartFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg);
      }
    }

    .heart-firework.animate {
      animation: heartFly 2.5s ease-out forwards;
    }

   .screen-content {
        flex: 0 0 42%;
        min-height: 0;
        overflow-y: auto;
        padding: clamp(12px, 2vw, 24px);
        background: #000;
        border: 5px solid #222;
        border-radius: 12px;
        -webkit-overflow-scrolling: touch;
    }
    .content-text {
      background: #000;
      border: 2px solid #000;
      border-radius: 12px;
      padding: 24px;
      color: #ffffff;
      line-height: 1.6;
      font-size: clamp(16px, 3vw, 20px);
      word-break: break-word;
      max-height: 100%;
    }

   .keyboard {
     flex: 0 0 58%;
     display: grid;
     grid-template-columns: repeat(3, 1fr);
     grid-template-rows: repeat(3, minmax(0, 1fr));
     gap: clamp(6px, 1vw, 12px);
     padding: clamp(8px, 2vw, 16px);
     background: #000;
     border-top: 5px solid #222;
     border-radius: 12px;
     min-height: 0;
   }

    .key-btn {
      background: #282431;
      border: 2px solid #888;
      color: #ffffff;
      border-radius: 12px;
      font-family: 'Space Mono', monospace;
      font-size: clamp(14px, 2.5vw, 18px);
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(200, 200, 200, 0.2);
      position: relative;
      padding: clamp(6px, 1.5vw, 8px);
      line-height: 1.3;
      white-space: normal;
      word-break: break-word;
      min-height: 40px;
    }

    .key-btn:not(:disabled):not(.inactive):hover {
      border-color: #aaa;
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(200, 200, 200, 0.3), inset 0 0 12px rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .key-btn:not(:disabled):not(.inactive):active {
      transform: scale(0.92);
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 0, 0, 0.4), 0 0 10px rgba(200, 200, 200, 0.15);
    }

    .key-btn.active { /*Yellow*/
      background: #121112;
      color: #ffffff;
      border-color: #ffff00;
      box-shadow: 10px 10px 20px rgba(255, 255, 0, 0.5), 0 0 25px rgba(255, 255, 0, 0.3), 0 0 15px rgba(200, 200, 200, 0.2), inset 0 0 12px rgba(255, 255, 0, 0.1);
      font-weight: 700;
    }

    .key-btn.active:active {
      transform: scale(0.92);
      box-shadow: 10px 10px 20px rgba(255, 255, 0, 0.3), 0 0 15px rgba(255, 255, 0, 0.2), 0 0 10px rgba(200, 200, 200, 0.15);
    }
    .key-btn.selected-red {
      border-color: #ff5555;
      box-shadow: 10px 10px 20px rgba(255, 85, 85, 0.4), 0 0 25px rgba(255, 85, 85, 0.2), 0 0 15px rgba(200, 200, 200, 0.2);
      color: #ffffff;
    }

    .key-btn.selected-red:active {
      transform: scale(0.92);
      box-shadow: 10px 10px 20px rgba(255, 85, 85, 0.2), 0 0 15px rgba(255, 85, 85, 0.1), 0 0 10px rgba(200, 200, 200, 0.15);
    }

    .key-btn.heart-unselected {
      background: #282431;
      border-color: #aaa;
      color: #ffffff;
      font-size: clamp(38px, 5vw, 24px);
    }

    .key-btn.heart-unselected:hover {
      border-color: #aaa;
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(200, 200, 200, 0.3), inset 0 0 12px rgba(255, 255, 255, 0.1);
    }

    .key-btn.heart-selected {
      border-color: #ff5555;
      color: #ffffff;
      background: #282431;
      box-shadow: 10px 10px 20px rgba(255, 85, 85, 0.6), 0 0 40px rgba(255, 85, 85, 0.5), inset 0 0 15px rgba(255, 85, 85, 0.2);
      font-size: clamp(38px, 5vw, 24px);
      font-weight: 800;
    }

    .key-btn.heart-selected:active {
      transform: scale(0.92);
      box-shadow: 10px 10px 20px rgba(255, 85, 85, 0.6), 0 0 30px rgba(255, 85, 85, 0.4), inset 0 0 12px rgba(255, 85, 85, 0.2);
    }

    .key-btn.heart-selected:hover {
      box-shadow: 10px 10px 25px rgba(255, 85, 85, 0.8), 0 0 50px rgba(255, 85, 85, 0.6), inset 0 0 18px rgba(255, 85, 85, 0.3);
      transform: translateY(-1px);

    }

    .key-btn.close-btn {
      background: #282431;
      border-color: #888;
      color: #ffffff;
      grid-column: 1;
      grid-row: 3;
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(200, 200, 200, 0.2);
      font-size: clamp(12px, 3vw, 24px);
    }

    .key-btn.close-btn:not(.inactive):hover {
      border-color: #aaa;
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(200, 200, 200, 0.3), inset 0 0 12px rgba(255, 255, 255, 0.1);
    }

    .key-btn.close-btn:active {
      transform: scale(0.92);
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 0, 0, 0.4), 0 0 10px rgba(200, 200, 200, 0.15);
    }

    .key-btn.inactive {
      background: transparent;
      border-color: #444;
      color: #ffffff;
      cursor: not-allowed;
      opacity: 0.5;
      box-shadow: none;
    }

    .key-btn.back-btn {
      background: #282431;
      border-color: #888;
      color: #ffffff;
      grid-column: 1;
      grid-row: 3;
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(200, 200, 200, 0.2);
      font-size: clamp(16px, 4vw, 24px);
    }

    .key-btn.back-btn.transparent-bg {
      background: #282431; /*transparent*/
    }

    .key-btn.back-btn:not(.inactive):hover {
      border-color: #aaa;
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(200, 200, 200, 0.3), inset 0 0 12px rgba(255, 255, 255, 0.1);
    }

    .key-btn.back-btn:active {
      transform: scale(0.92);
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 0, 0, 0.4), 0 0 10px rgba(200, 200, 200, 0.15);
    }

    .key-btn.logo-btn {
      background: #ff5555;
      border: 2px solid #ff6666;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow:
        10px 10px 20px rgba(255, 85, 85, 0.6),
        0 0 30px rgba(255, 85, 85, 0.4),
        0 0 15px rgba(200, 200, 200, 0.2);
      border-radius: 12px;
      position: relative;
      padding: clamp(6px, 1.5vw, 8px);
      line-height: 1.3;
      min-height: 40px;
      grid-column: span 2;
      grid-row: span 1;
    }

    .key-btn.logo-btn:hover {
      box-shadow: 10px 10px 25px rgba(255, 85, 85, 0.8), 0 0 35px rgba(255, 85, 85, 0.5), 0 0 20px rgba(200, 200, 200, 0.3);
      border-color: #ff7777;
      transform: translateY(-1px);
    }

    .key-btn.logo-btn:active {
      transform: scale(0.92);
      box-shadow: 10px 10px 20px rgba(255, 85, 85, 0.5), 0 0 20px rgba(255, 85, 85, 0.3), 0 0 10px rgba(200, 200, 200, 0.15);
    }

    .logo-text {
      font-size: clamp(28px, 7vw, 41px);
      color: #ffff00;
      font-weight: 800;
      font-family: 'Sniglet', cursive;
      letter-spacing: 1px;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000, 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    input[type="email"] {
      width: 100%;
      padding: clamp(10px, 2vw, 12px);
      background: #2a2a2a;
      border: 2px solid #555;
      color: #ffffff;
      border-radius: 6px;
      font-family: 'Space Mono', monospace;
      margin-top: 12px;
      font-size: clamp(14px, 2.5vw, 16px);
    }

    input[type="email"]:focus {
      outline: none;
      border-color: #6B5BFF;
      box-shadow: 0 0 12px rgba(107, 91, 255, 0.4);
    }
    .error-msg {
      color: #ff5555;
      font-size: clamp(12px, 2vw, 15px);
      margin-top: 8px;
    }

   .email-page .screen-content {
     flex: 75%;
   
     display: flex;
     justify-content: center;
     align-items: center;
   }
   
   .email-page .keyboard {
     flex: 25%;
   }

   .email-page .content-text {
     width: min(600px, 100%);
     text-align: center;
   }

   #debugHeight {
   position: fixed;
   top: 200px;
   left: 50%;
   transform: translateX(-50%);
   z-index: 99999;
   background: red;
   color: white;
   padding: 8px 12px;
   border-radius: 8px;
   font-size: 16px;
   font-weight: bold;
 }


    html {
        background: red !important;
    }
    
    body {
        background: blue !important;
    }
    
    .app-container {
        background: green !important;
    }

   
</style>

<body>
<div class="app-container">
<div id="goodbyeScreen" class="goodbye-message" style="display: none;">

<div class="screen-content" id="mainContent"><div class="content-text" id="contentText"></div></div>

</div>
<script>

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound() {
      try {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(500, now + 0.04);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0, now + 0.04);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    // ============ CONTENT TEMPLATES - EASY TO MODIFY ============

      },
      program: {
        title: ':> 2026 CarData Demos!',
        subtitle: ':> Book for your Demo sessions!'
      },
      demoDetail: [
        {
          name: 'DataDrivenDesign',
          description: 'Transform your data into visual insights',
          location: '@ Hall A - Stand 1',

        },

        {

        },
       
        {

          name: 'CarDataUsage',
          description: 'Monitor and optimize data usage',
          location: '@ Hall C - Stand 3',

        },

        {

          name: 'EVA',
          description: 'Electric vehicle analytics platform',
          location: '@ Hall A - Stand 4',
          presenter: 'by: David Brown',
          duration: '18 min',
          sessionIndices: [6, 7]
        },

        {
          name: 'DataMobilize',

          duration: '15 min',
          sessionIndices: [8, 9]
        },

        {
          name: 'CustomerExperience',
          description: 'Enhance customer interactions with data',
          location: '@ Hall C - Stand 6',
          presenter: 'by: Frank Miller',
          duration: '20 min',
          sessionIndices: [10, 11]
        }

      ],

      sessions: [

        'Session 1',
        'Session 2',
        'Session 3',
        'Session 4',
        'Session 5',
        'Session 6',
        'Session 7',
        'Session 8',
        'Session 9',
        'Session 10',
        'Session 11',
        'Session 12'
      ],

      quiz: {
        title: ':> 2026 CarData Quiz!',
        subtitle: ':> Let\'s Quiz to win CarData 2026 award!!! <3'
      },

      bookConfirm: {
        title: ':> For more Demos, press back button!',
        subtitle: ':> Press Done if finished booking! :)'
      },

      myDemos: {
        title: ':> Cool! Your Demo program is ready!',
        subtitle: ':> Take a screenshot & be Ontime for your session! See you!<br>:> Hint: Go to CarData to find the way! B-)'

      },

      myQuiz: {
        title: ':> Geart Job! Here are your answers!',
        subtitle: ':> See you at 14:00 for The CarData prize session!<br>:> Hint: Go to CarData to find the way! B-)'
      },

      rating: {
        title: ':> That wa so DataDriven of you! <3',
        subtitle: ':> Thanks to rate CarData DemoDays! <3'
      }

    };

    const app = {
      currentPage: 'email',
      email: localStorage.getItem('userEmail') || '',
      bookings: JSON.parse(localStorage.getItem('bookings') || '[]'),
      quizAnswers: JSON.parse(localStorage.getItem('quizAnswers') || '{}'),
      ratingHearts: JSON.parse(localStorage.getItem('ratingHearts') || '[]'),
      selectedTimeslot: null,
      selectedAnswer: null,
      selectedDemoIndex: null,
      currentQuestion: 0,
      emailError: ''

    };

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    }

    function resetApp() {
      localStorage.removeItem('userEmail');
      localStorage.removeItem('bookings');
      localStorage.removeItem('quizAnswers');
      localStorage.removeItem('ratingHearts');
      app.email = '';
      app.bookings = [];
      app.quizAnswers = {};
      app.ratingHearts = [];
      app.selectedTimeslot = null;
      app.selectedAnswer = null;
      app.selectedDemoIndex = null;
      app.currentQuestion = 0;
      app.emailError = '';
      app.currentPage = 'email';
      render();

    }

    function goTo(page, param = null) {
      playClickSound();
      app.currentPage = page;
      app.selectedTimeslot = null;
      app.selectedAnswer = null;
      app.emailError = '';
      if (page === 'demo' && param !== null) {
        app.selectedDemoIndex = param;
      }
      if (page === 'question' && param !== null) {
        app.currentQuestion = param;
      }
      render();
    }

    function renderEmailPage() {
      return `
<span style="color: #ffffff;">

          ${CONTENT.email.title}
<br>

          ${CONTENT.email.subtitle}
<br>
<input type="email" id="emailInput" placeholder="name@email.com">

          ${app.emailError ? `<div class="error-msg" style="color: #ffffff;">${app.emailError}</div>` : ''}
</span>

      `;

    }

    function renderHomePage() {
      return `<span style="color: #ffffff;">${CONTENT.home.title}</span>`;
    }

    function renderProgramPage() {
      return `
<span style="color: #ffffff;">
          ${CONTENT.program.title}
<br>
          ${CONTENT.program.subtitle}
</span>
      `;

    }

    function renderDemoDetail(index) {
      const demo = CONTENT.demoDetail[index];
      const session1Index = demo.sessionIndices[0];
      const session2Index = demo.sessionIndices[1];
      const session1Name = CONTENT.sessions[session1Index];
      const session2Name = CONTENT.sessions[session2Index];
      return `
<span style="color: #ffffff;">
          :> ${demo.name}
<br>
          :> ${demo.description}<br>
          :> Choose your session below!
</span>
      `;
    }

    function renderQuizStartPage() {
      return `
<span style="color: #ffffff;">
          ${CONTENT.quiz.title}
<br>
          ${CONTENT.quiz.subtitle}
</span>
      `;
    }

    function renderQuestionPage(index) {
      return `
<span style="color: #ffffff;">
          :> Q${index + 1}: Question Here.................
<br>.................
<br>
          :> Please choose the answer below!
</span>
      `;
    }

    function renderMyDemosPage() {
      if (app.bookings.length === 0) {
        return `<span style="color: #ffffff;">:> No demos booked yet!</span>`;
      }
      return `
<span style="color: #ffffff;">
          ${CONTENT.myDemos.title}
<br>
          ${CONTENT.myDemos.subtitle}
</span>
      `;
    }

    function renderMyQuizPage() {
      if (Object.keys(app.quizAnswers).length === 0) {
        return `<span style="color: #ffffff;">:> No quiz answers yet!</span>`;
      }

      return `
<span style="color: #ffffff;">
          ${CONTENT.myQuiz.title}
<br>
          ${CONTENT.myQuiz.subtitle}
</span>
      `;
    }
 
    function renderRatingPage() {
      return `
<span style="color: #ffffff;">
          ${CONTENT.rating.title}
<br>
          ${CONTENT.rating.subtitle}
</span>
      `;
    }

    function renderBookingConfirm() {
      return `
<span style="color: #ffffff;">
          ${CONTENT.bookConfirm.title}
<br>
          ${CONTENT.bookConfirm.subtitle}
</span>
      `;
    }

    function getDemoBookingInfo(demoIndex) {
      const booking = app.bookings.find(b => b.demoIndex === demoIndex);
      if (booking) {
        const demo = CONTENT.demoDetail[demoIndex];
        const actualSessionIndex = demo.sessionIndices[booking.timeslotIndex];
        const sessionName = CONTENT.sessions[actualSessionIndex];
        return `<span style="color: #ffffff;">
          ${demo.name}<br>
          ${sessionName}<br>
          ${demo.location} • ${demo.presenter} • ${demo.duration}
</span>`;
      }
      return `<span style="color: #ffffff;">Demo${demoIndex + 1}</span>`;
    }
    function getQuizAnswerInfo(questionIndex) {
      if (app.quizAnswers[questionIndex] !== undefined) {
        const answerLetter = String.fromCharCode(65 + app.quizAnswers[questionIndex]);
        return `<span style="color: #ffffff;">Q${questionIndex + 1} - ${answerLetter}</span>`;
      }
      return `<span style="color: #ffffff;">Q${questionIndex + 1}</span>`;
    }
 
    function renderKeyboard() {
      const kb = document.getElementById('keyboard');
      kb.innerHTML = '';
      const buttons = getKeyboardButtons();
      buttons.forEach((btn, idx) => {
        let keyBtn;
        if (btn.isLogo) {
          keyBtn = document.createElement('button');
          keyBtn.className = 'key-btn logo-btn';
          keyBtn.innerHTML = '<span class="logo-text">CarData</span>';
        } else if (btn.isBackBtn) {
          keyBtn = document.createElement('button');
          keyBtn.className = 'key-btn back-btn';
          if (btn.inactive) keyBtn.classList.add('inactive');
          // Add transparent background on specific pages

          if (['myDemos', 'demo', 'quiz', 'myQuiz'].includes(app.currentPage)) {
            keyBtn.classList.add('transparent-bg');
          }
          keyBtn.textContent = btn.label;
        } else if (btn.isCloseBtn) {
          keyBtn = document.createElement('button');
          keyBtn.className = 'key-btn close-btn';
          if (btn.inactive) keyBtn.classList.add('inactive');
          keyBtn.textContent = btn.label;
        } else {
          keyBtn = document.createElement('button');
          keyBtn.className = 'key-btn';
          if (btn.inactive) keyBtn.classList.add('inactive');
          if (btn.active) keyBtn.classList.add('active');
          if (btn.selectedRed) keyBtn.classList.add('selected-red');
          if (btn.heartSelected) keyBtn.classList.add('heart-selected');
          if (btn.heartUnselected) keyBtn.classList.add('heart-unselected');
          keyBtn.innerHTML = btn.label;
        }
        keyBtn.onclick = () => {
          if (!btn.inactive && btn.onClick) {
            btn.onClick();
          }
        };
        kb.appendChild(keyBtn);
      });
    }

    app.validateAndLogin = function() {
      const emailInput = document.getElementById('emailInput');
      const email = emailInput?.value.trim() || '';
      if (!email) {
        app.emailError = 'Please enter an email address';
        render();
        return;
      }
      if (!validateEmail(email)) {
        app.emailError = 'Please enter a valid email (format: name@domain.com)';
        render();
        return;
      }
      app.email = email;
      localStorage.setItem('userEmail', email);
      goTo('home');
    };

    app.bookDemo = function() {
      if (app.selectedTimeslot !== null && app.selectedDemoIndex !== null) {
        const booking = { demoIndex: app.selectedDemoIndex, timeslotIndex: app.selectedTimeslot };
        app.bookings.push(booking);
        localStorage.setItem('bookings', JSON.stringify(app.bookings));
        goTo('bookConfirm');
      }
    };
 
    app.selectTimeslot = function(index) {
      playClickSound();
      app.selectedTimeslot = app.selectedTimeslot === index ? null : index;
      render();
    };

    app.selectAnswer = function(index) {
      playClickSound();
      app.selectedAnswer = app.selectedAnswer === index ? null : index;
      render();

    };

    app.toggleHeart = function(index) {
      playClickSound();
      if (app.ratingHearts.includes(index)) {
        app.ratingHearts = app.ratingHearts.filter(i => i !== index);
      } else {
        app.ratingHearts.push(index);
      }
      localStorage.setItem('ratingHearts', JSON.stringify(app.ratingHearts));

      // Check if all 6 hearts are selected

      if (app.ratingHearts.length === 6) {
        triggerHeartFirework();
      }
      render();
    };
 

    function triggerHeartFirework() {
      const container = document.getElementById('heartFireworkContainer');
      container.innerHTML = '';
      // Create multiple hearts that fly across screen
      for (let i = 0; i < 50; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-firework'
        heart.innerHTML = '♥️';
        // Random starting position near center
        const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 100;
        const startY = window.innerHeight / 2 + (Math.random() - 0.5) * 100;
        heart.style.left = startX + 'px';
        heart.style.top = startY + 'px';
        // Random direction for hearts to fly
        const angle = (Math.random() * Math.PI * 2);
        const velocity = 150 + Math.random() * 200;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity;
        heart.style.setProperty('--tx', tx + 'px');
        heart.style.setProperty('--ty', ty + 'px');
        // Random delay for staggered animation
        heart.style.animationDelay = (Math.random() * 0.3) + 's';
        container.appendChild(heart);
        // Add animate class to trigger animation
        setTimeout(() => {
          heart.classList.add('animate');
        }, 10);
      }
      // Clear container after animation
      setTimeout(() => {
        container.innerHTML = '';
      }, 3000);
    }
    app.nextQuestion = function() {

      let html = '';
      switch(app.currentPage) {

          break;
        case 'program':

          break;
        case 'demo':
          html = renderDemoDetail(app.selectedDemoIndex);
          break;
        case 'bookConfirm':
          html = renderBookingConfirm();
          break;
        case 'quiz':
          html = renderQuizStartPage();
          break;
        case 'question':
          html = renderQuestionPage(app.currentQuestion);
          break;
        case 'myDemos':
          html = renderMyDemosPage();
          break;
        case 'myQuiz':
          html = renderMyQuizPage();
          break;
        case 'rating':
          html = renderRatingPage();
          break;
      }
      document.body.classList.toggle(
       'email-page',
        app.currentPage === 'email'
      );
      contentText.innerHTML = html;
      renderKeyboard();
    }
    if (app.email) {
      app.currentPage = 'home';
    } else {
      app.currentPage = 'email';
    }
    render();
 
    // Fullscreen functionality for mobile
    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => {
          console.log('Fullscreen request failed:', err);
        });
      }
    }

    function exitFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(err => {
          console.log('Exit fullscreen failed:', err);
        });
      }
    }

    function updateViewportHeight() {
        const vv = window.visualViewport;
        const height = vv ? vv.height : window.innerHeight;
    
        // Définit la hauteur de l'application
        document.documentElement.style.setProperty(
            '--app-height',
            `${height}px`
        );
    
        // DEBUG
        const debug = document.getElementById('debugHeight');
        const app = document.querySelector('.app-container');
        const screen = document.querySelector('.screen-content');
        const keyboard = document.querySelector('.keyboard');
    
        if (debug && app && screen && keyboard) {
            const appRect = app.getBoundingClientRect();
            const screenRect = screen.getBoundingClientRect();
            const keyboardRect = keyboard.getBoundingClientRect();
    
            debug.innerHTML = `
                VIEWPORT<br>
                innerHeight = ${window.innerHeight}px<br>
                clientHeight = ${document.documentElement.clientHeight}px<br>
                visualViewport = ${vv ? vv.height : 'N/A'}px<br>
                CSS height = ${getComputedStyle(app).height}<br><br>
    
                APP<br>
                height = ${appRect.height}px<br>
                top = ${appRect.top}px<br>
                bottom = ${appRect.bottom}px<br><br>
    
                SCREEN<br>
                height = ${screenRect.height}px<br>
                top = ${screenRect.top}px<br>
                bottom = ${screenRect.bottom}px<br><br>
    
                KEYBOARD<br>
                height = ${keyboardRect.height}px<br>
                top = ${keyboardRect.top}px<br>
                bottom = ${keyboardRect.bottom}px
            `;
        }
    
        // 🔧 Force Chrome à refaire un repaint/reflow du conteneur
        requestAnimationFrame(() => {
            const app = document.querySelector('.app-container');
    
            if (app) {
                app.style.display = 'none';
    
                // Force le navigateur à recalculer le layout
                void app.offsetHeight;
    
                app.style.display = 'flex';
            }
        });
    }
    
    // Initialisation
    updateViewportHeight();
    
    // Recalcul après le premier rendu
    requestAnimationFrame(updateViewportHeight);
    
    // Événements
    window.addEventListener('resize', updateViewportHeight);
    window.addEventListener('orientationchange', updateViewportHeight);
    
    window.visualViewport?.addEventListener(
        'resize',
        updateViewportHeight
    );
    
    window.addEventListener('pageshow', updateViewportHeight);
    
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            updateViewportHeight();
        }
    });

    app.showGoodbye = function() {
      const goodbyeScreen = document.getElementById('goodbyeScreen');
      goodbyeScreen.style.display = 'flex';
      setTimeout(() => {
        // ✅ EXIT FULLSCREEN when quitting app
        exitFullscreen();
        // Close app after 3 seconds
        setTimeout(() => {
          window.location.reload();
        }, 3000);
      }, 2000);
    };

    app.closeApp = function() {
      // ✅ EXIT FULLSCREEN when closing app
      exitFullscreen();

      // Show goodbye screen first
      const goodbyeScreen = document.getElementById('goodbyeScreen');
      goodbyeScreen.style.display = 'flex';

      // Reload after goodbye message
      setTimeout(() => {
        window.location.reload();
      }, 3000);
